#  sohailsq/sohailsq profile repo
name: Metrics

on:
  schedule:
    - cron: "0 1 * * *"   # daily
  workflow_dispatch:       # manual run button
  push:
    branches: [main]
    paths-ignore:
      - "metrics.*.svg"

permissions:
  contents: write

jobs:
  achievements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}   # classic PAT, see steps below
          user: sohailsq
          filename: metrics.achievements.svg
          base: ""                               # render only the plugin below
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 8
